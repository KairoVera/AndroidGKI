name: Setup pinned root implementation
description: Clone exactly one supported root implementation at a verified commit
inputs:
  flavor:
    description: 'kernelsu, next, resukisu, sukisu-ultra, or kowsu'
    required: true
  commit:
    description: 'Full immutable commit SHA'
    required: true

runs:
  using: composite
  steps:
    - name: Clone and integrate selected root
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        flavor="${{ inputs.flavor }}"
        expected_commit="${{ inputs.commit }}"

        # Debug: print inputs and capture to file for artifact
        {
          echo "=== root-setup debug ==="
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "INPUT_FLAVOR=${{ inputs.flavor }}"
          echo "INPUT_COMMIT=${{ inputs.commit }}"
          echo "flavor=$flavor"
          echo "expected_commit=${expected_commit}"
          echo "commit_len=${#expected_commit}"
          echo "PWD=$PWD"
          echo "github.workspace=${{ github.workspace }}"
          echo ""
          echo "=== Directory contents ==="
          ls -la "$PWD" || true
          echo ""
          echo "=== common/drivers exists ==="
          [ -d "common/drivers" ] && echo "YES" || echo "NO"
          [ -d "drivers" ] && echo "drivers exists: YES" || echo "drivers exists: NO"
          echo ""
          echo "=== Candidate directories ==="
          for candidate in KernelSU KernelSU-Next ReSukiSU SukiSU-Ultra SukiSU-Ultra-Custom KowSU; do
            if [ -e "$candidate" ]; then
              echo "FOUND: $candidate ($(ls -ld "$candidate" | awk '{print $NF}'))"
            else
              echo "NOT_FOUND: $candidate"
            fi
          done
          echo ""
          echo "=== Case statement result ==="
          echo "About to enter case statement..."
        } | tee /tmp/root-setup-debug.log

        case "$flavor" in
          kernelsu)
            repo="https://github.com/tiann/KernelSU.git"
            directory="KernelSU"
            manager="KernelSU Manager"
            ;;
          next)
            repo="https://github.com/KernelSU-Next/KernelSU-Next.git"
            directory="KernelSU-Next"
            manager="KernelSU Next Manager"
            ;;
          resukisu)
            repo="https://github.com/ReSukiSU/ReSukiSU.git"
            directory="ReSukiSU"
            manager="ReSukiSU Manager"
            ;;
          sukisu-ultra)
            repo="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
            directory="SukiSU-Ultra"
            manager="SukiSU-Ultra Manager"
            ;;
          kowsu)
            repo="https://github.com/KOWX712/KernelSU.git"
            directory="KowSU"
            manager="KowSU Manager"
            ;;
          sukisu-ultra-custom)
            # Use custom-main branch from fork with SUSFS integration patches
            repo="https://github.com/KairoVera/SukiSU-Ultra.git"
            directory="SukiSU-Ultra-Custom"
            manager="SukiSU-Ultra-Custom Manager"
            ;;
          *)
            echo "Unsupported root flavor: $flavor" >&2
            exit 2
            ;;
        esac

        if ! [[ "$expected_commit" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Root commit must be a full 40-character SHA." >&2
          exit 2
        fi

        for candidate in KernelSU KernelSU-Next ReSukiSU SukiSU-Ultra SukiSU-Ultra-Custom KowSU; do
          if [ -e "$candidate" ]; then
            # Clean up any leftover checkout from a previous failed run
            echo "[*] Cleaning up stale checkout: $candidate"
            rm -rf "$candidate"
          fi
        done

        if [ -d common/drivers ]; then
          drivers_dir="common/drivers"
        elif [ -d drivers ]; then
          drivers_dir="drivers"
        else
          echo "Kernel drivers directory not found." >&2
          exit 1
        fi

        if [ -e "$drivers_dir/kernelsu" ] || [ -L "$drivers_dir/kernelsu" ]; then
          echo "Refusing to replace an existing kernelsu integration." >&2
          exit 1
        fi
        if [ -e "$directory" ]; then
          echo "Refusing to reuse an existing root checkout: $directory." >&2
          exit 1
        fi

        echo "=== DEBUG: About to clone ==="
        echo "repo=$repo"
        echo "directory=$directory"
        echo "expected_commit=$expected_commit"
        echo "PWD=$PWD"
        echo ""
        echo "=== Checking for existing directory ==="
        if [ -d "$directory" ]; then
          echo "[!] Directory exists, removing..."
          rm -rf "$directory"
        fi
        echo "=== Attempting git clone ==="
        git clone --no-checkout "$repo" "$directory" 2>&1
        echo "[*] Clone exit code: $?"
        
        if git -C "$directory" fetch --depth=1 origin "$expected_commit" 2>/tmp/git-fetch-error.log; then
          echo "[*] git fetch succeeded"
        else
          echo "[!] git fetch FAILED:" >&2
          cat /tmp/git-fetch-error.log >&2
          exit 1
        fi
        
        if git -C "$directory" checkout --detach "$expected_commit" 2>/tmp/git-checkout-error.log; then
          echo "[*] git checkout succeeded"
        else
          echo "[!] git checkout FAILED:" >&2
          cat /tmp/git-checkout-error.log >&2
          exit 1
        fi
        
        actual_commit="$(git -C "$directory" rev-parse HEAD)"
        echo "[*] actual_commit=$actual_commit"
        
        if [ "$actual_commit" != "$expected_commit" ]; then
          echo "Root commit mismatch: expected $expected_commit, got $actual_commit." >&2
          exit 1
        fi
        echo "[*] Commit verified successfully"

        # custom-main uses standard Kbuild (multiple source files), while builtin
        # uses unity build (single ksu.c). Detect the variant and configure accordingly.
        relative_kernel="$(realpath --relative-to="$drivers_dir" "$PWD/$directory/kernel")"
        if [ -f "$directory/kernel/Kbuild" ]; then
          # custom-main style: standard Kbuild with multiple source files
          echo "[*] Detected standard Kbuild layout (custom-main style)"
          if [ ! -f "$directory/kernel/Kconfig" ]; then
            echo "Selected root checkout does not contain a kernel integration (missing Kconfig)." >&2
            exit 1
          fi
          # For Kbuild-based trees, the driver Makefile needs to include
          # the kernel's own Kbuild rather than listing objects.
          # The kernel/Kbuild already handles obj-$(CONFIG_KSU) correctly.
          grep -q 'include "$relative_kernel/Kbuild"' "$drivers_dir/Makefile" ||
            printf '\ninclude "$relative_kernel/Kbuild"\n' >> "$drivers_dir/Makefile"
          grep -q 'source "drivers/kernelsu/Kconfig"' "$drivers_dir/Kconfig" ||
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$drivers_dir/Kconfig"
        else
          # builtin style: unity build with single ksu.c
          if [ ! -f "$directory/kernel/Kconfig" ] || [ ! -f "$directory/kernel/Makefile" ]; then
            echo "Selected root checkout does not contain a kernel integration." >&2
            exit 1
          fi
          root_version="$(git -C "$directory" describe --tags --always --dirty)"
          ln -s "$relative_kernel" "$drivers_dir/kernelsu"
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' "$drivers_dir/Makefile" ||
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$drivers_dir/Makefile"
          grep -q 'source "drivers/kernelsu/Kconfig"' "$drivers_dir/Kconfig" ||
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$drivers_dir/Kconfig"
        fi

        echo "ROOT_IMPLEMENTATION=$flavor" >> "$GITHUB_ENV"
        echo "ROOT_MANAGER=$manager" >> "$GITHUB_ENV"
        echo "ROOT_VERSION=$root_version" >> "$GITHUB_ENV"
        echo "ROOT_COMMIT=$actual_commit" >> "$GITHUB_ENV"

    - name: Enable root configuration
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y

    - name: Soften KernelSU-Next Kbuild config guard for mrproper
      if: inputs.flavor == 'next'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # Upstream Next's drivers/kernelsu/Kbuild hard-errors at parse time
        # when neither CONFIG_KPROBES nor CONFIG_KSU_SUSFS is set. During
        # build.sh's mrproper phase no .config exists yet, so the clean step
        # dies before defconfig ever sets CONFIG_KSU_SUSFS=y. Demote to a
        # warning: the message stays visible, and the real build still gets
        # CONFIG_KSU_SUSFS=y via defconfig. No-op if upstream drops the guard.
        for d in common/drivers/kernelsu drivers/kernelsu; do
          if [ -f "$d/Kbuild" ] && grep -q 'KernelSU requires either CONFIG_KPROBES' "$d/Kbuild"; then
            sed -i 's/$(error "KernelSU requires either CONFIG_KPROBES=y or CONFIG_KSU_SUSFS=y")/$(warning "KernelSU requires either CONFIG_KPROBES=y or CONFIG_KSU_SUSFS=y")/' "$d/Kbuild"
            echo "Softened KSU config guard in $d/Kbuild"
          fi
        done

    - name: Disable multi-manager for ReSukiSU
      if: inputs.flavor == 'resukisu'
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=n
          CONFIG_KSU_TOOLKIT_SUPPORT=y

    - name: Soften ReSukiSU Kbuild submodule check for bazel builds
      if: inputs.flavor == 'resukisu'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # Fallback: demote the git submodule check from error to warning.
        # Modify the Kbuild in the ReSukiSU checkout so the change propagates
        # through the symlink into bazel sandbox.
        for d in ReSukiSU/kernel; do
          if [ -f "$d/Kbuild" ] && grep -q 'You should use \$\(REPO_NAME\) as a git submodule instead of copying code directly' "$d/Kbuild"; then
            sed -i 's/\$(error You should use \$\(REPO_NAME\) as a git submodule instead of copying code directly)/\$(warning You should use \$\(REPO_NAME\) as a git submodule instead of copying code directly)/' "$d/Kbuild"
            echo "Softened ReSukiSU submodule check in $d/Kbuild"
          fi
        done

    - name: Backfill missing arch.h for SukiSU-Ultra builtin
      if: inputs.flavor == 'sukisu-ultra'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # SukiSU-Ultra builtin branch has #include "arch.h" in kernel/kernel_includes.h
        # since commit 486ad6f29 (Sep 21) but never committed kernel/include/arch.h.
        # main branch has it. Backfill here so the kernel build succeeds.
        if [ ! -f "SukiSU-Ultra/kernel/include/arch.h" ]; then
          echo "[*] Backfilling kernel/include/arch.h from SukiSU-Ultra main branch"
          mkdir -p SukiSU-Ultra/kernel/include
          curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/include/arch.h" \
            -o SukiSU-Ultra/kernel/include/arch.h
          chmod 644 SukiSU-Ultra/kernel/include/arch.h
          ls -la SukiSU-Ultra/kernel/include/arch.h
        else
          echo "[*] arch.h already present, skipping backfill"
        fi

    - name: Patch missing EVENT_SERVICES for SukiSU-Ultra builtin on 5.10
      if: inputs.flavor == 'sukisu-ultra'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # builtin branch supercall.h is missing EVENT_SERVICES (only main has it).
        # Add it so dispatch.c compiles. Only needed for 5.10 kernels where
        # builtin hasn't picked up the main uapi changes yet.
        SUPERCALL_H="SukiSU-Ultra/kernel/include/uapi/supercall.h"
        if grep -q "EVENT_MODULE_MOUNTED" "$SUPERCALL_H" && ! grep -q "EVENT_SERVICES" "$SUPERCALL_H"; then
          echo "[*] Adding EVENT_SERVICES to $SUPERCALL_H"
          sed -i '/DECLARE(__u32, EVENT_MODULE_MOUNTED, 3);/a DECLARE(__u32, EVENT_SERVICES, 4);' "$SUPERCALL_H"
        else
          echo "[*] EVENT_SERVICES already present or not needed, skipping"
        fi

    - name: Patch duplicate declaration in rules.c for SukiSU-Ultra builtin
      if: inputs.flavor == 'sukisu-ultra'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # builtin branch rules.c has a double declaration of pol/old_pol:
        #   line 154: struct selinux_policy *pol, *old_pol;
        #   line 162: struct selinux_policy *pol, *old_pol = selinux_state.policy;
        # Remove the redundant redeclaration inside the #if block to fix the build.
        RULES_C="SukiSU-Ultra/kernel/selinux/rules.c"
        if grep -n "struct selinux_policy \*pol, \*old_pol;" "$RULES_C" | head -2 | wc -l | grep -q "2"; then
          echo "[*] Removing duplicate pol/old_pol declaration in $RULES_C"
          # Remove the second occurrence (line with = selinux_state.policy)
          sed -i '/struct selinux_policy \*pol, \*old_pol = selinux_state.policy;/d' "$RULES_C"
          # Also remove the extra = selinux_state.policy from the next line if it exists
          sed -i 's/\*old_pol = selinux_state.policy;*/\*old_pol;/' "$RULES_C"
        else
          echo "[*] Duplicate declaration not detected, skipping"
        fi

    - name: Apply SUSFS patches for SukiSU-Ultra-Custom (custom-main)
      if: inputs.flavor == 'sukisu-ultra-custom'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # custom-main branch includes susfs-patches with SUSFS integration
        # Apply KSU module patches for new Kbuild architecture
        if [ -d "SukiSU-Ultra-Custom/kernel/susfs-patches" ]; then
          echo "[*] Found susfs-patches directory, applying KSU module patches"
          cd SukiSU-Ultra-Custom/kernel
          for patch in susfs-patches/kernel_patches/KernelSU/2*.patch; do
            if [ -f "$patch" ]; then
              echo "[*] Applying $patch"
              patch -p1 < "$patch" || echo "[!] Failed to apply $patch, continuing..."
            fi
          done
        else
          echo "[*] susfs-patches directory not found, skipping KSU module patches"
          echo "[*] GKI kernel patches should be applied by AndroidGKI workflow"
        fi

    - name: Upload debug log on failure
      if: failure()
      shell: bash
      run: |
        if [ -f /tmp/root-setup-debug.log ]; then
          echo "=== Uploading debug log ==="
          cat /tmp/root-setup-debug.log
          echo ""
          # Upload as artifact
          mkdir -p debug-logs
          cp /tmp/root-setup-debug.log debug-logs/root-setup-debug.log
        fi

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: root-setup-debug-logs
        path: debug-logs/
        retention-days: 1