name: 'Show ccache Stats'
description: 'Display ccache statistics, hit rates, and config'
inputs:
  clear_stats:
    description: 'Whether to clear ccache stats after displaying (default: true)'
    required: true
    type: boolean
    default: true

runs:
  using: 'composite'
  steps:
    - name: Show ccache Stats
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        echo "===================="
        echo "=== ccache stats ==="
        echo "===================="

        if ! command -v ccache >/dev/null 2>&1; then
          echo "[!]  ccache not installed, skipping ccache stats"
          echo "===================="
          exit 0
        fi

        echo "=== ccache config ==="
        echo "====================="
        ccache -p || true
        echo "====================="

        STATS="$(ccache -s)"
        echo "$STATS"

        CACHEABLE=$(echo "$STATS" | awk '/Cacheable calls:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)
        HITS=$(echo "$STATS" | awk '/^[[:space:]]*Hits:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)
        DIRECT=$(echo "$STATS" | awk '/Direct:/ { match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH) }' | head -n1)

        if [ "${CACHEABLE:-0}" -gt 0 ]; then
          HIT_RATE=$(awk -v h="${HITS:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (h/c)*100}')
          DIRECT_RATE=$(awk -v d="${DIRECT:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (d/c)*100}')
          echo "hit_rate=${HIT_RATE}%"
          echo "direct_rate=${DIRECT_RATE}%"
        else
          echo "hit_rate=0.0%"
          echo "direct_rate=0.0%"
        fi

        if [ "${{ inputs.clear_stats }}" = "true" ]; then
          echo "=== ccache reset ==="
          echo "====================="
          ccache -z || true
          echo "====================="
          # NOTE: this step used to `touch -t "1 day ago"` every cached
          # object so the pre-save prune (`find -mtime +0.5 -delete`)
          # could tell "restored stale" from "built this run". That
          # mtime bookkeeping fought the tar restore (fresh mtimes) and
          # ccache's own accounting, and — combined with
          # CCACHE_DIRECT=true (object names embed per-VM inodes, so
          # "this run" objects never matched "restored" objects) the
          # archive snowballed 0.6 -> 1.2 GB every run. With
          # CCACHE_DIRECT=false the keys are preprocessor-stable, the
          # same object name is reused across runs, and the cache no
          # longer grows: nothing to mark stale, no touch needed.
        fi
