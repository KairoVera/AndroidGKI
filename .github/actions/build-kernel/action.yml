name: 'Build Kernel'
description: 'Builds kernel using legacy build.sh or Bazel (kleaf)'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true

runs:
  using: composite
  steps:
  - name: Setup Kernel Configs
    if: false
    uses: ./.github/actions/set-kernel-config

  - name: 'Provide host ld from repo prebuilts'
    shell: bash
    run: |
      # build.sh scrubs HOSTLDFLAGS out of the environment, so the only way
      # to steer the host linker is to put an "ld" on PATH: prebuilt clang
      # invokes the bare name "ld" when building host tools (fixdep, modpost,
      # ...). Source priority:
      #   1. BUILD-CONFIG CLANG (precise): source the build config the kernel
      #      actually uses (common/build.config.gki.aarch64 -> build.config.
      #      common) and read CLANG_PREBUILT_BIN — the clang bin dir the build
      #      is *supposed* to link with. This asks "which clang does the build
      #      use" instead of guessing the newest one on disk; a 5.10 tree can
      #      ship several clangs and the wrong one breaks host-tool linking.
      #   2. FIND (fallback): if the config chain or toolchain dir is
      #      incomplete, fall back to the largest ld.lld under prebuilts-*.
      #   3. SYSTEM / 4. APT: system ld, then apt binutils.
      # All finds are `|| true`-guarded: the runner shell is `bash -e -o
      # pipefail`, so a failing find or a SIGPIPE from `tail` must not kill
      # this step before the fallbacks run.
      WS="${{ github.workspace }}"
      KROOT="$WS/kernel"
      LDLLD=""

      # --- Precise locator: ask build.config which clang the build uses. ---
      # CLANG_PREBUILT_BIN is defined in build.config.common and pulled in by
      # build.config.gki.aarch64 (its first line sources it) with
      # ROOT_DIR/KERNEL_DIR set; its value is RELATIVE to the kernel root.
      CLANG_BIN=""
      if [ -f "$KROOT/common/build.config.gki.aarch64" ]; then
        # cd into the kernel root so the configs' relative ". common/..."
        # sources and their ROOT_DIR/KERNEL_DIR references resolve; this
        # host-ld step has no working-directory (default = repo root).
        CLANG_BIN=$(cd "$KROOT" && ROOT_DIR="$KROOT" KERNEL_DIR=common bash -c '
          [ -f common/build.config.constants ] && . common/build.config.constants
          . common/build.config.gki.aarch64
          printf "%s" "$CLANG_PREBUILT_BIN"
        ' 2>/dev/null || true)
      fi
      if [ -n "$CLANG_BIN" ]; then
        case "$CLANG_BIN" in
          /*) CBIN="$CLANG_BIN" ;;
          *)  CBIN="$KROOT/$CLANG_BIN" ;;
        esac
        if [ -f "$CBIN/ld.lld" ]; then
          LDLLD="$CBIN/ld.lld"
          echo "host ld: build-config clang $LDLLD"
        else
          echo "host ld: build-config clang dir $CBIN has no ld.lld; falling back"
        fi
      fi

      # --- Fallback: largest ld.lld on disk (config locator empty/unsynced). ---
      if [ -z "$LDLLD" ]; then
        for ROOT in "$KROOT/prebuilts-master" "$KROOT/prebuilts"; do
          [ -d "$ROOT" ] || continue
          LDLLD=$(find "$ROOT" -name "ld.lld" -type f 2>/dev/null | sort -V | tail -n 1 || true)
          [ -n "$LDLLD" ] && break
        done
      fi
      if [ -n "$LDLLD" ] && [ -x "$LDLLD" ]; then
        sudo ln -sf "$LDLLD" /usr/local/bin/ld
        echo "host ld: repo-synced $LDLLD ($( "$LDLLD" --version 2>/dev/null | head -n 1 ))"
      elif command -v ld >/dev/null 2>&1 && ld --version >/dev/null 2>&1; then
        echo "host ld: system $(command -v ld) ($(ld --version | head -n 1))"
      else
        echo "host ld: none available; installing binutils via apt"
        sudo apt-get update -qq
        sudo apt-get install -y -qq binutils
        echo "host ld: $(which ld) ($(ld --version | head -n 1))"
      fi

  - name: 'Build Kernel'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      sed -i 's/check_defconfig//' ./common/build.config.gki
      if [ -f "build/build.sh" ]; then
        BUILD_GKI_ARTIFACTS="" \
        BUILD_GKI_CERTIFICATION_TOOLS=0 \
        BUILD_SYSTEM_DLKM=0 \
        SKIP_VENDOR_BOOT=1 \
        SKIP_EXT_MODULES=1 \
        SKIP_CP_KERNEL_HDR=1 \
        OUT_DIR="/home/runner/out" \
        LTO=thin \
        BUILD_CONFIG=common/build.config.gki.aarch64 \
        CC="/usr/bin/ccache clang" \
        CXX="/usr/bin/ccache clang++" \
        HOSTCC="/usr/bin/ccache clang" \
        HOSTCXX="/usr/bin/ccache clang++" \
        build/build.sh -j"$(nproc)"
      else
        sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
        tools/bazel build \
          --config=fast \
          --disk_cache=/home/runner/.cache/bazel \
          //common:kernel_aarch64/Image
      fi

  - name: 'Gather Build Artifacts'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail
      if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
        echo "Found Image at bazel-bin/common/kernel_aarch64/Image"
        cp "bazel-bin/common/kernel_aarch64/Image" "${{ github.workspace }}/AnyKernel3/Image"
        exit 0
        fi
      if [ -f "/home/runner/out/dist/Image" ]; then
        echo "Found Image at /home/runner/out/dist/Image"
        cp "/home/runner/out/dist/Image" "${{ github.workspace }}/AnyKernel3/Image"
        exit 0
      fi

      exit 1

