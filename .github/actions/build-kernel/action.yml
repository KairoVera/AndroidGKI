name: 'Build Kernel'
description: 'Builds kernel using legacy build.sh or Bazel (kleaf)'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true

runs:
  using: composite
  steps:
  - name: Setup Kernel Configs
    if: false
    uses: ./.github/actions/set-kernel-config
  
  - name: 'Provide host ld from repo prebuilts'
    shell: bash
    run: |
      # build.sh scrubs HOSTLDFLAGS out of the environment, so the only way
      # to steer the host linker is to put an "ld" on PATH: prebuilt clang
      # invokes the bare name "ld" when building host tools (fixdep, modpost,
      # ...). Source priority:
      #   1. BUILD-CONFIG CLANG (precise): source the build config the kernel
      #      actually uses (common/build.config.gki.aarch64 -> build.config.
      #      common) and read CLANG_PREBUILT_BIN — the clang bin dir the build
      #      is *supposed* to link with. This asks "which clang does the build
      #      use" instead of guessing the newest one on disk; a 5.10 tree can
      #      ship several clangs and the wrong one breaks host-tool linking.
      #   2. FIND (fallback): if the config chain or toolchain dir is
      #      incomplete, fall back to the largest ld.lld under prebuilts-*.
      #   3. SYSTEM / 4. APT: system ld, then apt binutils.
      # All finds are `|| true`-guarded: the runner shell is `bash -e -o
      # pipefail`, so a failing find or a SIGPIPE from `tail` must not kill
      # this step before the fallbacks run.
      WS="${{ github.workspace }}"
      KROOT="$WS/kernel"
      LDLLD=""

      # --- Precise locator: ask build.config which clang the build uses. ---
      # CLANG_PREBUILT_BIN is defined in build.config.common and pulled in by
      # build.config.gki.aarch64 (its first line sources it) with
      # ROOT_DIR/KERNEL_DIR set; its value is RELATIVE to the kernel root.
      CLANG_BIN=""
      if [ -f "$KROOT/common/build.config.gki.aarch64" ]; then
        # cd into the kernel root so the configs' relative ". common/..."
        # sources and their ROOT_DIR/KERNEL_DIR references resolve; this
        # host-ld step has no working-directory (default = repo root).
        CLANG_BIN=$(cd "$KROOT" && ROOT_DIR="$KROOT" KERNEL_DIR=common bash -c '
          [ -f common/build.config.constants ] && . common/build.config.constants
          . common/build.config.gki.aarch64
          printf "%s" "$CLANG_PREBUILT_BIN"
        ' 2>/dev/null || true)
      fi
      if [ -n "$CLANG_BIN" ]; then
        case "$CLANG_BIN" in
          /*) CBIN="$CLANG_BIN" ;;
          *)  CBIN="$KROOT/$CLANG_BIN" ;;
        esac
        if [ -f "$CBIN/ld.lld" ]; then
          LDLLD="$CBIN/ld.lld"
          echo "host ld: build-config clang $LDLLD"
          # CEILING LAYER: this resolved clang bin dir ships its own ld.lld.
          # Record it so the Build step can forward HOSTLDFLAGS=-fuse-ld=lld as
          # a make COMMAND-LINE variable: the clang driver then links host tools
          # with the ld.lld sitting next to the clang binary itself — self-
          # contained, needs no PATH entry and no /usr/local/bin symlink, and is
          # impossible to point at the wrong clang. The 3-tier symlink fallback
          # below stays as a belt for the case where this assumption (ld.lld
          # co-located with the resolved clang) ever changes.
          echo "host_ld_fuse=1" >> "$GITHUB_ENV"
        else
          echo "host ld: build-config clang dir $CBIN has no ld.lld; falling back"
        fi
      fi

      # --- Fallback: largest ld.lld on disk (config locator empty/unsynced). ---
      if [ -z "$LDLLD" ]; then
        for ROOT in "$KROOT/prebuilts-master" "$KROOT/prebuilts"; do
          [ -d "$ROOT" ] || continue
          LDLLD=$(find "$ROOT" -name "ld.lld" -type f 2>/dev/null | sort -V | tail -n 1 || true)
          [ -n "$LDLLD" ] && break
        done
      fi
      if [ -n "$LDLLD" ] && [ -x "$LDLLD" ]; then
        sudo ln -sf "$LDLLD" /usr/local/bin/ld
        echo "host ld: repo-synced $LDLLD ($( "$LDLLD" --version 2>/dev/null | head -n 1 ))"
      elif command -v ld >/dev/null 2>&1 && ld --version >/dev/null 2>&1; then
        echo "host ld: system $(command -v ld) ($(ld --version | head -n 1))"
      else
        echo "host ld: none available; installing binutils via apt"
        sudo apt-get update -qq
        sudo apt-get install -y -qq binutils
        echo "host ld: $(which ld) ($(ld --version | head -n 1))"
      fi

  - name: 'Build Kernel'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      sed -i 's/check_defconfig//' ./common/build.config.gki
      if [ -f "build/build.sh" ]; then
        # CC reaches make as a COMMAND-LINE variable ("CC=ccache clang" is
        # forwarded verbatim through build.sh's MAKE_ARGS into every make
        # invocation), NOT via the environment.
        #
        # Why the environment form is dead: GKI's build.sh honors a
        # shell-level CC only on its non-LLVM path. GKI kernel builds set
        # LLVM=1, and that branch hard-resets the shell variable to bare
        # clang (build/build.sh: `[[ -n "${LLVM}" ]] && CC=clang`), so any
        # env CC we exported was silently dropped before make ran — the
        # whole kernel compiled with stock clang and the ccache dir stayed
        # 0 bytes (Cacheable calls: 0).
        #
        # The make-command-line form wins over every assignment inside
        # kernel/Makefile (only `make -override` could beat it), so
        # CC="ccache clang" survives LLVM=1 and is the documented GKI way
        # to hook ccache into an LLVM kernel build. ccache resolves the
        # second word ("clang") on PATH exactly the way the stock build
        # did, so nothing about the toolchain changes — only that
        # every translation unit passes through /home/runner/.ccache.
        # Why "ccache" must be whitelisted, not just passed as CC: with
        # HERMETIC_TOOLCHAIN=1 (our build.config.gki), _setup_env.sh
        # rebuilds PATH from scratch for the whole make run — it starts
        # from a host_tools dir symlinking only a fixed allowlist
        # (bash git perl rsync sh tar + $ADDITIONAL_HOST_TOOLS), then
        # prepends the prebuilt dirs (CLANG_PREBUILT_BIN etc.). "clang"
        # and "ld.lld" resolve from prebuilts; "ccache" lives in
        # /usr/bin and is invisible there, so make dies with
        # "ccache: No such file or directory" / "compiler 'ccache
        # clang' not found". The GKI-supported escape hatch is exactly
        # ADDITIONAL_HOST_TOOLS (documented in build/build.sh, already
        # used by our BBG fragment for "dd"): it symlinks /usr/bin/ccache
        # into the allowlist dir before PATH is locked. ccache then runs
        # the prebuilt clang exactly as the stock build did — only every
        # translation unit now passes through /home/runner/.ccache.
        # ---- KernelSU-Next Kbuild disjunction guard (precise + no-op-safe) ----
        # The SUSFS-flavored Next source (pershoot/KernelSU-Next dev-susfs)
        # ships a two-level guard at the top of its Kbuild:
        #     ifneq ($(strip $(CONFIG_KPROBES)),y)
        #     ifneq ($(strip $(CONFIG_KSU_SUSFS)),y)
        #     $(error "KernelSU requires either CONFIG_KPROBES=y or CONFIG_KSU_SUSFS=y")
        # GKI's build.sh runs `make mrproper` *before* `gki_defconfig`, so in
        # that clean window no .config exists yet, both variables are empty,
        # and the guard aborts the build before defconfig sets CONFIG_KSU_SUSFS=y.
        #
        # Upstream's own fix (e14ff0de: sed error->warning, gated on
        # flavor==next) matches the English message, so it silently no-ops if
        # the wording changes and prints a warning on every Next build.
        #
        # We instead satisfy the disjunction at the make layer. The symbol
        # CONFIG_KSU_SUSFS appears in the Kbuild only in the SUSFS variant
        # (plain Next never mentions it), so its presence is a clean
        # discriminator: if found, forward CONFIG_KSU_SUSFS=y as a build.sh
        # argument. build.sh forwards extra args verbatim into every make
        # invocation (same mechanism as CC="ccache clang"), so the guard sees
        # it = y and is skipped with no warning. That value is exactly what
        # defconfig sets for the SUSFS variant, so the final artifacts are
        # unchanged; the Kbuild source is left untouched; and if upstream drops
        # the guard the argument becomes a harmless dead variable.
        KSU_PRECFG=""
        for kb in "common/drivers/kernelsu/Kbuild" "drivers/kernelsu/Kbuild"; do
          [ -f "$kb" ] || continue
          if grep -q 'CONFIG_KSU_SUSFS' "$kb"; then
            KSU_PRECFG="CONFIG_KSU_SUSFS=y"
            echo "[+] $kb references CONFIG_KSU_SUSFS -> pre-satisfying the mrproper guard"
            break
          fi
        done

        # GKI's build.sh re-executes itself under `env -i` with a fixed
        # variable whitelist, so plain environment variables are stripped —
        # HOSTLDFLAGS must be passed as a make COMMAND-LINE variable (forwarded
        # verbatim via MAKE_ARGS="$@" into every make call) for it to survive
        # (same mechanism as CC="ccache clang").
        #
        # -fuse-ld=lld is gated on the host-ld step's `host_ld_fuse` env flag:
        # it was set ONLY when the build-config resolver confirmed the exact
        # clang bin dir we'd use ships its own ld.lld. In that case the clang
        # driver resolves the linker next to the binary (no PATH involvement,
        # no /usr/local/bin/ld), and the 3-tier symlink belt is still in
        # effect as a safety net if the prebuilts layout ever diverges. When
        # the gate is unset (config chain empty, dir not synced, or no ld.lld
        # beside the resolved clang), we silently fall through to the belt
        # layers without forcing a linker name the driver can't find.
        BUILD_GKI_ARTIFACTS="" \
        BUILD_GKI_CERTIFICATION_TOOLS=0 \
        BUILD_SYSTEM_DLKM=0 \
        SKIP_VENDOR_BOOT=1 \
        SKIP_EXT_MODULES=1 \
        SKIP_CP_KERNEL_HDR=1 \
        OUT_DIR="/home/runner/out" \
        LTO=thin \
        BUILD_CONFIG=common/build.config.gki.aarch64 \
        ADDITIONAL_HOST_TOOLS="ccache" \
        build/build.sh -j"$(nproc)" "CC=ccache clang" $([ -n "$KSU_PRECFG" ] && echo "$KSU_PRECFG") $([ -n "$host_ld_fuse" ] && echo "HOSTLDFLAGS=-fuse-ld=lld")
      else
        sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
        tools/bazel build \
          --config=fast \
          --disk_cache=/home/runner/.cache/bazel \
          //common:kernel_aarch64/Image
      fi

  - name: 'Gather Build Artifacts'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail
      if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
        echo "Found Image at bazel-bin/common/kernel_aarch64/Image"
        cp "bazel-bin/common/kernel_aarch64/Image" "${{ github.workspace }}/AnyKernel3/Image"
        exit 0
        fi
      if [ -f "/home/runner/out/dist/Image" ]; then
        echo "Found Image at /home/runner/out/dist/Image"
        cp "/home/runner/out/dist/Image" "${{ github.workspace }}/AnyKernel3/Image"
        exit 0
      fi

      exit 1

