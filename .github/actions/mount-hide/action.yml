name: 'Apply SukiSU-Ultra source build-time fixes'
description: |
  Apply GCI build-time fixes to the SukiSU-Ultra root source tree:
    1. mount_hide: narrow /proc mount open-refusal to isolated uid spaces only
       (a non-isolated regular app such as com.miui.home, uid 10140 keeps a
       real /proc mount view; module unmounting stays kernel_umount.c's job).
       Without this, mount_hide refused a non-isolated app's open("/proc/mounts")
       with -ENOENT -> PLOG(FATAL) -> desktop bootloop.
    2. throne_tracker: add the missing ';' after the my_dir_context initializer
       (pre-existing SukiSU-Ultra 05f5cdf0 compile break, -Werror).
  Each patch is applied with patch -p1, idempotent, and safe-skips if absent.
runs:
  using: composite
  steps:
    - name: Apply SukiSU-Ultra source build-time fixes
      working-directory: ${{ github.workspace }}/kernel/SukiSU-Ultra
      shell: bash
      run: |
        set -euo pipefail
        PATCHDIR="${GITHUB_WORKSPACE}/.github/actions/mount-hide/patches"
        # Apply a patch only if it actually applies at the checked-out SukiSU
        # commit; otherwise skip it safely (each fix targets a specific pin's
        # source layout and must not break builds on other pins).
        apply() {
          local label="$1" patchfile="$2"
          if patch -p1 --forward --dry-run < "$patchfile" >/dev/null 2>&1; then
            echo "[*] Applying ${label}"
            patch -p1 --forward < "$patchfile"
          else
            echo "[*] ${label} not applicable at this SukiSU commit; skipping (safe)."
          fi
        }
        # 1) mount_hide: scope open-refusal to isolated uids
        #    (fixes non-isolated app open("/proc/mounts")=-ENOENT -> PLOG(FATAL) bootloop)
        if [ -f kernel/feature/mount_hide.c ]; then
          if grep -q "scoped to ISOLATED uid spaces" kernel/feature/mount_hide.c; then
            echo "[*] mount_hide already scoped to isolated uids; skipping (idempotent)."
          else
            apply "mount_hide isolated-only fix" \
              "$PATCHDIR/0001-scope-mount-hide-to-isolated-uids.patch"
          fi
        else
          echo "[!] kernel/feature/mount_hide.c not found; skipping mount_hide patch."
        fi
        # 2) throne_tracker: add missing ';' after the initializer
        #    (pre-existing SukiSU 05f5cdf0 compile break; no-op on other pins)
        if [ -f kernel/manager/throne_tracker.c ]; then
          if grep -q 'pos->depth };$' kernel/manager/throne_tracker.c; then
            echo "[*] throne_tracker semicolon already present; skipping (idempotent)."
          else
            apply "throne_tracker missing-semicolon fix" \
              "$PATCHDIR/0002-fix-throne-tracker-missing-semicolon.patch"
          fi
        fi
        # 3) app_profile: keep seccomp filter mode (stock-like) for SUSFS builds
        #    instead of SukiSU's unconditional disable_seccomp(); a filter-less root
        #    context deviates from stock Android app behavior and is a detection
        #    tell. Whitelists reboot so root tooling still works. Only live when
        #    CONFIG_KSU_SUSFS is set (our GCI builds); inert otherwise.
        if [ -f kernel/policy/app_profile.c ]; then
          if grep -q 'GCI/SukiSU root-evasion: keep the inherited seccomp-bpf' kernel/policy/app_profile.c; then
            echo "[*] app_profile seccomp keep-filter already present; skipping (idempotent)."
          else
            apply "0003-sukisu-app-profile-seccomp-keep-filter" \
              "$PATCHDIR/0003-sukisu-app-profile-seccomp-keep-filter.patch"
          fi
        fi
        echo "[*] SukiSU-Ultra source build-time fixes applied."
