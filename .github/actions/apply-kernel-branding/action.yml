name: 'Apply Kernel Branding & Timestamp'
description: 'Apply kernel branding to kernel version string'
inputs:
  variant:
    description: 'Variant of kernel to apply branding to'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  version:
    description: 'Combined version (e.g., android14-6.1)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  brand_name:
    description: 'Branding text appended to the version (e.g., Wild). Empty = stock version string.'
    required: false
    default: Wild
  keep_kmi:
    description: 'Keep stock KMI generation suffix (e.g., -8) and append brand after it. Off = legacy hardcoded replace.'
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Apply Kernel Name Branding
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        VERSION="${{ inputs.version }}"
        ANDROID_PART=$(echo "$VERSION" | cut -d- -f1)
        KERNEL_PART=$(echo "$VERSION" | cut -d- -f2)
        BRAND="${{ inputs.brand_name }}"
        KEEP_KMI="${{ inputs.keep_kmi }}"

        if [ -z "$BRAND" ]; then
          echo "brand_name is empty, keeping stock kernel version string"
          exit 0
        fi

        KMI=""
        if [ "$KEEP_KMI" = "true" ]; then
          # KMI_GENERATION lives in build.config.common; on GKI 2.0 trees the
          # extra value also sits in build.config.constants. The old one-line
          # `grep -h A B` was safe only when BOTH files exist: GKI 1.x
          # (5.10/5.15 android12/13) has NO build.config.constants, and GNU
          # grep then exits 2 on the missing operand. This step runs under
          # GitHub's default `bash -e -o pipefail`, so a failing command
          # substitution aborts the WHOLE step silently (stderr already
          # swallowed by 2>/dev/null) — that is exactly what took down all
          # 114 android12 jobs in run 35350930804 with zero output, 12ms in.
          # Probe each candidate file on its own: the [ -f ] guard skips the
          # missing one, and `|| true` keeps the substitution green so a
          # truly empty KMI degrades to the warning below instead of aborting.
          for CFG in build.config.common build.config.constants; do
            [ -f "$CFG" ] || continue
            KMI=$(grep "^KMI_GENERATION" "$CFG" 2>/dev/null | head -n 1 | cut -d= -f2 || true)
            [ -n "$KMI" ] && break
          done
          if [ -z "$KMI" ]; then
            echo "WARNING: KMI_GENERATION not found, falling back to legacy branding"
          fi
        fi

        if [ "$KEEP_KMI" = "true" ] && [ -n "$KMI" ]; then
          if grep -q 'scm_version}"' scripts/setlocalversion; then
            sed -i '$d' scripts/setlocalversion && echo "echo \"$KERNEL_PART.${{ inputs.sublevel }}-$ANDROID_PART-$KMI-$BRAND\"" >> scripts/setlocalversion
          else
            sed -i '$d' scripts/setlocalversion && echo "echo \"-$BRAND\"" >> scripts/setlocalversion
          fi
        else
          if [[ ${{ inputs.version }} == "android15-6.6" || ${{ inputs.version }} == "android16-6.12" || ${{ inputs.version }} == "android17-6.18" ]]; then
            KERNEL_STRING="$KERNEL_PART.${{ inputs.sublevel }}-$ANDROID_PART"
            sed -i '$d' scripts/setlocalversion && echo "echo \"$KERNEL_STRING-$BRAND\"" >> scripts/setlocalversion
          else
            sed -i '$d' scripts/setlocalversion && echo "echo \"-$ANDROID_PART-$BRAND\"" >> scripts/setlocalversion
          fi
        fi
        chmod +x scripts/setlocalversion
        tail -n 1 scripts/setlocalversion
